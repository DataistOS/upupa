# General Section (Metadata)
name: upupa_frontend
description: "UpUpa is the Backend-as-a-Service (BaaS) platform"
issue_tracker: https://github.com/DataistOS/upupa/issues
version: 0.1.3+1

# Environment
environment:
  sdk: ^3.8.1

# Dependencies
dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Network & API
  http: ^1.6.0

  # Serialization & Models
  json_annotation: ^4.9.0

  # Localization & Formatting
  intl: ^0.20.2

  # Persistence & Storage
  shared_preferences: ^2.5.3

  # Hardware, Media & Files
  file_picker: ^10.3.7
  path_provider: ^2.1.5

  # State Management
  provider: ^6.1.5+1

# Development Dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter / Code Style
  flutter_lints: ^5.0.0

  # Code Generation & Build Tools
  build_runner: ^2.10.4
  json_serializable: ^6.11.2

# Flutter specific configurations
flutter:
  uses-material-design: true