version: 2

project_name: upupa

dist: .builds

before:
  hooks:
    - go mod tidy --directory=upupa_backend

builds:
  - id: upupa_backend
    dir: upupa_backend
    main: ./cmd/main.go
    binary: upupa
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    builds: [ upupa_backend ]
    format: zip
    files:
      - LICENSE.md
      - README.md
      - VERSION

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^upupa_frontend:'
      - '^test:'