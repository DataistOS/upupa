name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go Backend
        run: |
          cd upupa_backend
          go build -o upupa-server ./cmd/main.go
        shell: bash

      - name: Install Flutter Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          cd upupa_frontend
          flutter pub get
          flutter build web --release
        shell: bash

      - name: Build Flutter Linux Desktop
        run: |
          cd upupa_frontend
          flutter build linux --release
        shell: bash

      - name: Package Release Assets
        run: |
          mkdir -p release_assets
          cp upupa_backend/upupa-server release_assets/upupa-backend-linux-amd64
          tar -czf release_assets/upupa-frontend-web.tar.gz -C upupa_frontend/build/web .
          tar -czf release_assets/upupa-frontend-linux-desktop.tar.gz -C upupa_frontend/build/linux/x64/release/bundle .
        shell: bash

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}